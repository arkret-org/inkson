[package]
name = "yougen"
version = "0.1.0"
edition = "2024"

[features]
protocol-test-vectors = []

[dependencies]
anyhow = "1.0.100"
base64 = "0.22"
chime = { path = "../chime" }
chrono = { version = "0.4.42", features = ["serde"] }
dioxus-router = "0.7"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
url = "2.5.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
contrix-sdk = { path = "../contrix-rust-sdk/crates/contrix-sdk", features = ["full-surface"] }
dioxus = { version = "=0.7.5", features = ["desktop", "mobile", "web"] }
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
contrix-sdk = { path = "../contrix-rust-sdk/crates/contrix-sdk", default-features = false }
dioxus = { version = "=0.7.5", features = ["web"] }
reqwest = { version = "0.12.24", features = ["json"], default-features = false }
tokio = { version = "1.48.0", features = ["macros", "rt", "sync", "time"] }
web-sys = { version = "0.3.82", features = ["Storage", "Window"] }
