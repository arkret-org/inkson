[package]
name = "inkson"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
description = "Dioxus desktop and web Arkret v1 reference client"
license = "Apache-2.0"
repository = "https://github.com/arkret-org/inkson"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = 0
strip = "debuginfo"
# opt-level >= 1 + incremental on wasm32 makes LLVM internalize cross-CGU
# `.llvm.`/`anon.*` symbols that rust-lld then reports as "undefined symbol"
# at link time (rust-lang/rust#115297). `cargo check` never links, so it
# passes while `dx build/serve --platform web` fails. Disabling incremental
# for this profile is the standard workaround.
incremental = false

# cotest serves the web output as static files rather than through `dx serve`.
# Disable debug assertions so dioxus-web does not embed its devtools WebSocket
# client in that bundle; failed `/_dioxus` reconnect callbacks can otherwise
# corrupt the long-lived wasm instance. Keep the wasm-dev optimization/linker
# settings without invoking release-only wasm-opt in the offline harness.
[profile.joint-e2e]
inherits = "dev"
opt-level = 1
debug = 0
strip = "debuginfo"
incremental = false
debug-assertions = false

[features]
# No default features. `OperationBuilder::build()` always emits
# `proofs: Vec::new()` (there is NO placeholder proof), and the runtime
# proof-mode default starts in [`operation::ProofMode::Production`] so
# the submit guard refuses to ship envelopes that were never signed by a
# real signer.
default = []
# Deferred protocol surfaces are compiled by default for unit coverage but
# hidden from the local 1.0 UI unless explicitly opted in.
experimental-discussion-promote = []
experimental-agents = []
experimental-applets = []
# Test-only wasm escape hatch for Playwright/cotest fixtures that must inject a
# real session grant and grant-binding seed before IndexedDB is ready. Production
# builds must not enable this feature.
wasm-localstorage-secrets-test = []
# Recovery / principal-bootstrap helpers the cross-repository joint harness
# drives from Rust. These are a test API, so they are negotiated by name.
# `debug_assertions` only describes a build's optimization posture — the
# `joint-e2e` profile inherits dev and turns it off — so gating a test
# capability on it silently compiles the capability out of exactly the profile
# that needs it. Production builds must not enable this feature.
joint-test-api = []
# Mobile host-bridge stubs. The `AndroidKeystoreSecureKeyStore` /
# `IosKeychainSecureKeyStore` types are host-bridge wrappers around a
# `HostSecretBridge` trait the platform shell installs; there is NO real
# JNI / Security.framework FFI inside inkson. The actual mobile artifacts
# are outside the local 1.0 milestone.
#
# Gating rule: these types are compiled when EITHER the target is the
# corresponding mobile OS (`target_os = "android"` / `target_os = "ios"`)
# OR the feature is explicitly enabled. That gives:
#   * Native Android / iOS builds — types auto-enabled, no manual feature
#     wiring required by downstream tooling.
#   * Desktop / wasm builds — types compiled OUT by default so the
#     desktop binary doesn't ship dead stub code; opt in with
#     `--features mobile-android,mobile-ios` to cross-compile-check.
mobile-android = []
mobile-ios = []

[dependencies]
# Feature-unification alias: `getrandom@0.2` is pulled in transitively by the
# crypto stack (rand_core 0.6 → p256/k256/hpke-rs/openmls and Arkret owner
# crates). On `wasm32-unknown-unknown` that 0.2.x dep needs the
# `js` feature so it routes RNG through Web Crypto; this alias is the only
# place in the workspace that turns it on. NOT used via `use getrandom_02`
# anywhere in src/ — do not remove without re-checking the wasm build.
# R31: derive `std::error::Error` + `Display` for the crate's `*Error`
# enums via `#[derive(thiserror::Error)]` instead of hand-rolled impls.
# Pure derive-macro crate, zero runtime, wasm-friendly. Pinned to the
# same major as the workspace SDK (`thiserror = "2.0.17"`).
# Event-proof signing. ed25519-dalek produces Ed25519 detached-JWS
# signatures for `event_signer`; did:key multibase encoding comes from
# the shared SDK helper.
# QR rendering for device-verification handoff. SVG output keeps the
# crate pure-Rust with no image / font dependencies.
# Recovery strand (R-recovery-001): real Argon2id passphrase stretching +
# XChaCha20-Poly1305 AEAD for the Encrypted Cloud Vault upload. Both crates
# are pure-Rust, no_std-friendly and build cleanly under wasm32; the same
# pin is used for the ciphertext digest's sha256 (already in `sha2`).
# key-management.md §7.5: backup AEAD key / nonce key / commitment key are HKDF
# subkeys of the Argon2id root, and the passphrase_kdf nonce is HMAC-SHA256 over
# a canonical transcript. Both pulled in transitively by the crypto stack; made
# direct here for the spec-conformant key-backup crypto.
# encryption-and-audit.md §2.9: the v2 reaction routing tag HMACs over the
# NFC-normalised canonical emoji bytes, so the chosen-emoji privacy property
# holds regardless of the sender's input normalisation form.
# key-management.md §7.5.2: `recipient_method=recovery_public_key` backups pin
# the v1 default-MUST application-layer HPKE suite
# `ak.hpke_x25519_aead_chacha20poly1305.v1` (DHKEM(X25519,HKDF-SHA256) +
# HKDF-SHA256 + ChaCha20-Poly1305, 96-bit nonce) — standard RFC 9180 SetupBase.
# `hpke_backup.rs` delegates the seal/open to the SDK's RFC 9180 single-shot API
# (`arkret_crypto::secret_share`, KAT-validated) and keeps only the recovery-keypair
# derivation over x25519-dalek / chacha20poly1305 / hkdf.
# Phase A.6 #1: zero plaintext-secret bytes on drop / overwrite for the
# in-memory secure key store. The crate is already in the dependency graph
# transitively (via ed25519-dalek / chacha20poly1305 / openmls); making it
# a direct dep lets `MemorySecureKeyStore` reach for `Zeroize` /
# `ZeroizeOnDrop` without an indirect import path.
# A3 (round 28): markdown rendering for the timeline/chat content
# renderer. pulldown-cmark is pure-Rust, no_std-friendly, and known to
# build cleanly under wasm32-unknown-unknown. Raw-HTML pass-through is
# left disabled (default) so untrusted message bodies cannot inject
# arbitrary tags via `dangerous_inner_html`.
anyhow = {workspace = true}
arkret-bootstrap = {version = "0.3.0",path = "../arkret-rust-sdk/crates/bootstrap",default-features = false}
arkret-crypto = {workspace = true,features = ["backup", "blob-aead", "key-verification", "secret-share", "sframe"]}
arkret-event-draft = {version = "0.3.0",path = "../arkret-rust-sdk/crates/event-draft",default-features = false}
arkret-identity = {version = "0.3.0",path = "../arkret-rust-sdk/crates/identity",default-features = false}
arkret-identifiers = {version = "0.3.0",path = "../arkret-rust-sdk/crates/identifiers",default-features = false}
arkret-models-collaboration = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-collaboration",default-features = false}
arkret-models-crypto = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-crypto",default-features = false}
arkret-models-discovery = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-discovery",default-features = false}
arkret-models-identity = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-identity",default-features = false}
arkret-models-integration = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-integration",default-features = false}
arkret-policy = {version = "0.3.0",path = "../arkret-rust-sdk/crates/policy",default-features = false}
arkret-schema = {version = "0.3.0",path = "../arkret-rust-sdk/crates/schema",default-features = false,features = ["embedded-artifacts"]}
arkret-signatures = {workspace = true}
arkret-locale = {version = "0.3.0",path = "../arkret-rust-sdk/crates/locale",default-features = false,features = ["serde"]}
arkret-wire = {version = "0.3.0",path = "../arkret-rust-sdk/crates/wire",default-features = false}
hex = "0.4.3"
base64 = {workspace = true}
bip39 = {workspace = true}
chacha20poly1305 = {workspace = true,default-features = false,features = ["alloc"]}
chime = {workspace = true,features = ["http"]}
chrono = {workspace = true,features = ["serde"]}
dioxus-primitives = {workspace = true,default-features = false}
dioxus-router = {workspace = true}
# C3: shared Arkret frontend component crate. The former `src/ui/`
# css-module wrappers now live in yoface, which re-exports
# `dioxus_primitives` and `dioxus_icons`; inkson imports
# `yoface::ui::*` through the SDK-local `pub use yoface::ui`.
# Keep the patch sections below aligned with the yoface README.
yoface = {path = "../yoface"}
ed25519-dalek = {workspace = true,features = ["pem", "pkcs8", "zeroize"]}
getrandom = {workspace = true,features = ["wasm_js"]}
getrandom_02 = {workspace = true,features = ["js"]}
# rand_core 0.6 alias for the arkret SDK webvh inception builder
# (`prepare_inception` takes a 0.6 `RngCore`); inkson's primary rand_core is 0.10.
rand_core_06 = {workspace = true}
hkdf = {workspace = true}
hmac = {workspace = true}
image = {workspace = true,default-features = false,features = ["gif", "jpeg", "png", "webp"]}
pulldown-cmark = {workspace = true,default-features = false,features = ["html"]}
qrcode = {workspace = true,default-features = false,features = ["svg"]}
serde = {workspace = true,features = ["derive"]}
serde_json = {workspace = true}
sha2 = {workspace = true}
thiserror = {workspace = true}
tracing = {workspace = true}
unicode-normalization = {workspace = true}
url = {workspace = true}
x25519-dalek = {workspace = true,features = ["static_secrets"]}
zeroize = {workspace = true,features = ["derive"]}

[dev-dependencies]
arkret-wire = {version = "0.3.0",path = "../arkret-rust-sdk/crates/wire",default-features = false,features = ["test-support"]}

# Build-time only: stamps `INKSON_BUILD_ID` (local build time + git short hash)
# so the running wasm can print which bundle the browser loaded — the
# definitive stale-cached-wasm check. Build deps do not affect the wasm binary.
[build-dependencies]
chrono = {workspace = true}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = "0.4.3"
# `ak.profile.binding.websocket.v1` native socket. garth owns the protocol;
# tungstenite only reassembles messages and enforces the byte ceiling.
futures-util = {workspace = true}
tokio-tungstenite = {workspace = true,features = ["rustls-tls-webpki-roots"]}
# T5.2 (2026-05-20): `signer` feature enabled so `event_signer` can pull
# in `arkret_sdk::signatures::Ed25519DetachedJwsSigner` for the
# `RealEd25519` proof-mode path. Without it the SDK signatures module is
# canonical-bytes-only and the active-write signing path has nothing to
# call into.
# Desktop secure storage delegates to the SDK's canonical platform backend;
# Inkson only adapts `KeyStore` to garth's `SecureKeyStore` contract.
# F-OS-NOTIFY-1 (2026-05-19): native desktop notifications. `notify-rust`
# bridges to macOS Notification Center, Linux freedesktop notifications,
# and Windows Toast notifications behind a single API. Skipped on the
# wasm32 build because browsers expose their own notification API
# directly through Dioxus / `web-sys`.
# YOU-01-007: `multipart` is required because the spec binds
# `POST /_arkret/self/blob/upload` to multipart/form-data
# (blob_upload_request_body), not a raw octet-stream body.
# AKP-0007 P3B.8.1 — opt-in crash telemetry. The Sentry client is
# initialised only when both the user-facing CrashTelemetryPrefs
# toggle is on AND a build-time `SENTRY_DSN` env var is set; an
# empty DSN logs a debug message and skips init silently per
# `src/telemetry.rs::sentry_init`. Wasm builds skip the dep entirely.
# NOTE: arkret-sdk `default = []`; this client opts into only its transport,
# MLS, signer and platform-keystore integrations. Crypto capabilities are
# selected directly on `arkret-crypto`.
arkret-sdk = {workspace = true,features = ["client", "mls", "signer", "keystore-macos", "keystore-linux", "keystore-windows"]}
garth = {path = "../garth",default-features = false,features = ["native"]}
dioxus = {workspace = true,features = ["desktop", "web"]}
notify-rust = {workspace = true}
reqwest = {workspace = true,default-features = false,features = ["json", "multipart", "rustls", "stream", "form"]}
sentry = {workspace = true,default-features = false,features = ["backtrace", "contexts", "panic", "reqwest", "rustls"]}
tokio = {workspace = true,features = ["macros", "rt-multi-thread", "sync", "time"]}
tracing-subscriber = {workspace = true,features = ["env-filter", "fmt"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm32 uses the same protocol/MLS surface as native while platform crypto
# capabilities are selected on their owner crates.
#
# T5.2: same `signer` feature as native — the wasm32 build uses the same
# Ed25519 detached-JWS pipeline; the signing seed comes from
# `LocalStorageSecureKeyStore` / `IndexedDbSecureKeyStore` instead of the
# OS keychain, with the documented "browser has no symmetric-secret tier"
# warning.
# Round 26 (A3): web-sys feature flags expanded so the WebPushTokenProvider
# can drive `navigator.serviceWorker.register` + `pushManager.subscribe(...)`
# end-to-end. The Crypto/SubtleCrypto features back the R5 WebCryptoBoundary
# so the WASM build can encrypt/decrypt against the browser's WebCrypto
# implementation while signing material stays in Rust (the SDK's
# MoveSigner / ed25519-dalek path is process-local and never leaves the
# wasm linear memory boundary).
# `tokio::time` is unsupported on wasm32-unknown-unknown — it calls
# `std::time::Instant::now()` and panics with "time not implemented on this
# platform". `gloo-timers` routes through `setTimeout` instead, which is what
# `sleep_for` uses for HTTP retry backoff in the wasm build.
# See the non-wasm note above.
arkret-sdk = {workspace = true,features = ["client", "mls", "signer"]}
garth = {path = "../garth",default-features = false,features = ["wasm"]}
dioxus = {workspace = true,features = ["web"]}
gloo-timers = {workspace = true,features = ["futures"]}
js-sys = {workspace = true}
reqwest = {workspace = true,default-features = false,features = ["json", "multipart", "stream", "form"]}
tokio = {workspace = true,features = ["macros", "rt", "sync", "time"]}
tracing-wasm = {workspace = true}
wasm-bindgen = {workspace = true}
wasm-bindgen-futures = {workspace = true}
web-sys = {workspace = true,features = [
    "Storage",
    "StorageEvent",
    "Window",
    "CssStyleDeclaration",
    "MediaQueryList",
    "Navigator",
    "StorageManager",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "PushManager",
    "PushSubscription",
    "PushSubscriptionOptionsInit",
    "Crypto",
    "SubtleCrypto",
    "CryptoKey",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlElement",
    "Url",
    # Sprint Q1 increment 22 (H6): IndexedDB-backed secure key store.
    # `IndexedDbSecureKeyStore` opens an IDB database, derives an
    # AES-GCM key via SubtleCrypto.deriveKey (`extractable: false`),
    # and persists entries under structured keys.
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbRequestReadyState",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "Event",
    "DomException",
    # Live WebRTC media transport (`src/rtc_transport/web.rs`): browser
    # RtcPeerConnection + getUserMedia capture + SDP offer/answer + ICE
    # candidate relay for 1:1 P2P and SFU room join.
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "RtcConfiguration",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcRtpSender",
    "RtcTrackEvent",
]}

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Stream J conformance gate (`tests/conformance_gates.rs`): JSON Schema
# 2020-12 validation of envelopes produced by typed builders against
# `arkret-spec/spec/v1/artifacts/schemas/event-envelope.schema.json`.
# Pinned to the same version cotest uses so a registry/resource bump
# lands in one place.

# arkret fork of DioxusLabs/components, branched off the same revision cargo
# already resolved. The only delta is an idempotency guard in
# `primitives/src/js/focus-trap.js`: `DialogRoot` injects that script per
# Dialog instance and dioxus re-executes it across mounts, but as a classic
# script its top-level `class FocusTrap` re-declaration threw
# `SyntaxError: 'FocusTrap' has already been declared`, corrupting the dialog
# focus-trap eval closure (`FnOnce called more than once` -> CLOSURE_DTORS
# out-of-bounds -> wasm heap corruption). See the fork branch for the full note.
jsonschema = {workspace = true,default-features = false,features = ["resolve-file"]}
rand_core = {workspace = true}
rand_core_06 = {workspace = true}
regex = {workspace = true}

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# Pinned by rev; bump deliberately when upgrading.
[patch."https://github.com/DioxusLabs/components"]
dioxus-primitives = { git = "https://github.com/arkret-org/dioxus-components", rev = "3510aeee2d14f0ca2c11682c9b826650cb557d2f" }

# arkret-org fork of DioxusLabs/dioxus, branched off the v0.7.9 tag. Its core
# delta is `Callback::__point_to` in `packages/core/src/events.rs`: upstream 0.7.9
# calls `.unwrap()` on `point_to`, which aborts the entire wasm instance (white
# screen) when an `Option<EventHandler>` prop's owner scope is reclaimed in the
# same frame the rsx diff tries to re-point its stable handle — surfacing as
# `Result::unwrap() on Dropped(ValueDroppedError)`. Re-pointing only reuses the
# stable handle for the current frame; the real callback is still owned by the
# new value, so the fork degrades that unwrap to a trace-log no-op.
#
# `generational-box` is vendored from the same v0.7.9 fork revision. It also
# treats pointing a storage entry at a reference which already resolves to that
# entry as a no-op. Without the resolved-pointer guard, unsync storage borrows
# the same RefCell immutably and mutably during LinkProps memoization and aborts
# wasm; sync storage can analogously try to upgrade its own read lock.
#
# The wasm-shared lifetime crates below MUST resolve to one source across the
# graph. A git `dioxus-core` pulls in git `generational-box` / `subsecond` via
# workspace deps, and if registry copies remained, `GenerationalBox<T>` would
# mismatch across registry `dioxus-signals`/`dioxus-web` and patched core. The
# second patch table replaces the fork's internal `generational-box` edge with
# the same vendored package used for crates.io consumers.
# See https://github.com/arkret-org/dioxus/commit/e59f9f24a5c27c9303cd61edd0452b44161374ab
# Pinned by rev; bump deliberately when upgrading.
[patch.crates-io]
dioxus-core       = { git = "https://github.com/arkret-org/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }
dioxus-core-types = { git = "https://github.com/arkret-org/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }
generational-box  = { path = "vendor/generational-box" }
subsecond         = { git = "https://github.com/arkret-org/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }
subsecond-types   = { git = "https://github.com/arkret-org/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }

[patch."https://github.com/arkret-org/dioxus"]
generational-box = { path = "vendor/generational-box" }

[workspace]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.102"
base64 = "0.22"
bip39 = "2.2.2"
chacha20poly1305 = {version = "0.10",default-features = false}
chime = {version = "0.3.0",path = "../chime"}
chrono = "0.4.45"
arkret-sdk = {package = "arkret",version = "0.3.0",path = "../arkret-rust-sdk/crates/sdk"}
arkret-signatures = {version = "0.3.0",path = "../arkret-rust-sdk/crates/signatures",default-features = false,features = ["collaboration"]}
# Needed only to name arkret_crypto::Result in the MlsExporterSource impl:
# the SFrame exporter trait moved to arkret-crypto (SDK phase 2-d), so its
# method signature returns arkret_crypto::Error at the crypto boundary.
arkret-crypto = {version = "0.3.0",path = "../arkret-rust-sdk/crates/crypto",default-features = false}
dioxus = {version = "0.7.9",default-features = false,features = ["minimal", "asset", "document", "mounted"]}
dioxus-primitives = {version = "0.0.1",git = "https://github.com/DioxusLabs/components",default-features = false}
dioxus-router = "0.7.9"
ed25519-dalek = "2.2.0"
getrandom = "0.4.2"
getrandom_02 = {package = "getrandom",version = "0.2.17"}
gloo-timers = "0.4"
hkdf = "0.13"
hmac = "0.13"
x25519-dalek = "2.0.1"
image = {version = "0.25.10",default-features = false}
js-sys = "0.3"
jsonschema = {version = "0.46.5",default-features = false}
notify-rust = "4.17"
pulldown-cmark = {version = "0.13",default-features = false}
qrcode = {version = "0.14",default-features = false}
rand_core = "0.10"
# Distinct alias for the rand_core 0.6 API the arkret SDK's webvh inception
# builder expects (`prepare_inception` takes a `rand_core::RngCore` from 0.6).
# inkson's primary `rand_core` is 0.10, so the SDK's RngCore trait is reached
# through this aliased dependency to keep trait identity matched.
rand_core_06 = {package = "rand_core", version = "0.6.4", features = ["std"]}
regex = "1.12"
reqwest = {version = "0.13.4",default-features = false}
sentry = {version = "0.48.2",default-features = false}
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.11"
thiserror = "2"
tokio = "1.52.3"
tracing = "0.1"
tracing-subscriber = "0.3.23"
tracing-wasm = "0.2.1"
unicode-normalization = "0.1"
url = "2.5.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-util = {version = "0.3.31",default-features = false,features = ["sink"]}
tokio-tungstenite = {version = "0.29.0",default-features = false,features = ["connect"]}
web-sys = "0.3.100"
zeroize = "1.8"
