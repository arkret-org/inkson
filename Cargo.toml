[package]
name = "yougen"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
description = "Dioxus desktop and web Cokret v1 reference client"
license = "Apache-2.0"
repository = "https://github.com/cokret/yougen"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = 0
strip = "debuginfo"
# opt-level >= 1 + incremental on wasm32 makes LLVM internalize cross-CGU
# `.llvm.`/`anon.*` symbols that rust-lld then reports as "undefined symbol"
# at link time (rust-lang/rust#115297). `cargo check` never links, so it
# passes while `dx build/serve --platform web` fails. Disabling incremental
# for this profile is the standard workaround.
incremental = false

[features]
# No default features. `OperationBuilder::build()` always emits
# `proofs: Vec::new()` (there is NO placeholder proof), and the runtime
# proof-mode default starts in [`operation::ProofMode::Production`] so
# the submit guard refuses to ship envelopes that were never signed by a
# real signer. NB: `demo-crypto` is opt-in — the `device_signature` /
# opaque-ciphertext placeholders only ship when explicitly enabled.
default = []
# I4 — gates the `device_signature` / `ciphertext` placeholders shipped by
# `upload_keys`, `publish_mls_key_package`, and `send_to_device`. Without
# this feature, those entry points return an error before any wire byte
# leaves the device. There is NO runtime env-var override.
demo-crypto = []
# Deferred protocol surfaces are compiled by default for unit coverage but
# hidden from the local 1.0 UI unless explicitly opted in.
experimental-discussion-promote = []
experimental-agents = []
experimental-applets = []
# Mobile host-bridge stubs. The `AndroidKeystoreSecureKeyStore` /
# `IosKeychainSecureKeyStore` types are host-bridge wrappers around a
# `HostSecretBridge` trait the platform shell installs; there is NO real
# JNI / Security.framework FFI inside yougen. The actual mobile artifacts
# are outside the local 1.0 milestone.
#
# Gating rule: these types are compiled when EITHER the target is the
# corresponding mobile OS (`target_os = "android"` / `target_os = "ios"`)
# OR the feature is explicitly enabled. That gives:
#   * Native Android / iOS builds — types auto-enabled, no manual feature
#     wiring required by downstream tooling.
#   * Desktop / wasm builds — types compiled OUT by default so the
#     desktop binary doesn't ship dead stub code; opt in with
#     `--features mobile-android,mobile-ios` to cross-compile-check.
mobile-android = []
mobile-ios = []

[dependencies]
# Feature-unification alias: `getrandom@0.2` is pulled in transitively by the
# crypto stack (rand_core 0.6 → p256/k256/hpke-rs/openmls and cokret-core →
# cokret-identifiers). On `wasm32-unknown-unknown` that 0.2.x dep needs the
# `js` feature so it routes RNG through Web Crypto; this alias is the only
# place in the workspace that turns it on. NOT used via `use getrandom_02`
# anywhere in src/ — do not remove without re-checking the wasm build.
# R31: derive `std::error::Error` + `Display` for the crate's `*Error`
# enums via `#[derive(thiserror::Error)]` instead of hand-rolled impls.
# Pure derive-macro crate, zero runtime, wasm-friendly. Pinned to the
# same major as the workspace SDK (`thiserror = "2.0.17"`).
# Event-proof signing. ed25519-dalek produces Ed25519 detached-JWS
# signatures for `event_signer`; did:key multibase encoding comes from
# the shared SDK helper.
# QR rendering for device-verification handoff. SVG output keeps the
# crate pure-Rust with no image / font dependencies.
# Recovery strand (R-recovery-001): real Argon2id passphrase stretching +
# XChaCha20-Poly1305 AEAD for the Encrypted Cloud Vault upload. Both crates
# are pure-Rust, no_std-friendly and build cleanly under wasm32; the same
# pin is used for the ciphertext digest's sha256 (already in `sha2`).
# key-management.md §7.5: backup AEAD key / nonce key / commitment key are HKDF
# subkeys of the Argon2id root, and the passphrase_kdf nonce is HMAC-SHA256 over
# a canonical transcript. Both pulled in transitively by the crypto stack; made
# direct here for the spec-conformant key-backup crypto.
# encryption-and-audit.md §2.9: the v2 reaction routing tag HMACs over the
# NFC-normalised canonical emoji bytes, so the chosen-emoji privacy property
# holds regardless of the sender's input normalisation form.
# key-management.md §7.5.2: `recipient_method=recovery_public_key` backups pin
# the v1 default-MUST application-layer HPKE suite
# `ck.hpke_x25519_aead_xchacha20poly1305.v1` (DHKEM(X25519,HKDF-SHA256) +
# HKDF-SHA256 + XChaCha20-Poly1305). The XChaCha AEAD is outside RFC 9180's
# base registry, so `hpke_backup.rs` hand-rolls DHKEM + HKDF + XChaCha20 over
# x25519-dalek / chacha20poly1305 / hkdf (same stack as the SDK recovery seal)
# rather than the `hpke-rs` RFC 9180 single-shot API.
# Phase A.6 #1: zero plaintext-secret bytes on drop / overwrite for the
# in-memory secure key store. The crate is already in the dependency graph
# transitively (via ed25519-dalek / chacha20poly1305 / openmls); making it
# a direct dep lets `MemorySecureKeyStore` reach for `Zeroize` /
# `ZeroizeOnDrop` without an indirect import path.
# A3 (round 28): markdown rendering for the timeline/chat content
# renderer. pulldown-cmark is pure-Rust, no_std-friendly, and known to
# build cleanly under wasm32-unknown-unknown. Raw-HTML pass-through is
# left disabled (default) so untrusted message bodies cannot inject
# arbitrary tags via `dangerous_inner_html`.
anyhow = {workspace = true}
argon2 = {workspace = true}
base64 = {workspace = true}
bip39 = {workspace = true}
chacha20poly1305 = {workspace = true,default-features = false,features = ["alloc"]}
chime = {workspace = true,features = ["http"]}
chrono = {workspace = true,features = ["serde"]}
dioxus-icons = {workspace = true,default-features = false}
dioxus-primitives = {workspace = true,default-features = false}
dioxus-router = {workspace = true}
# C3: shared Cokret frontend component crate. The former `src/ui/`
# css-module wrappers now live in yoface, which re-exports
# `dioxus_primitives` and `dioxus_icons`; yougen imports
# `yoface::ui::*` through the SDK-local `pub use yoface::ui`.
# Keep the patch sections below aligned with the yoface README.
yoface = {path = "../yoface"}
ed25519-dalek = {workspace = true,features = ["pem", "pkcs8", "zeroize"]}
getrandom = {workspace = true,features = ["wasm_js"]}
getrandom_02 = {workspace = true,features = ["js"]}
# rand_core 0.6 alias for the cokret SDK webvh inception builder
# (`prepare_inception` takes a 0.6 `RngCore`); yougen's primary rand_core is 0.10.
rand_core_06 = {workspace = true}
hkdf = {workspace = true}
hmac = {workspace = true}
image = {workspace = true,default-features = false,features = ["gif", "jpeg", "png", "webp"]}
pulldown-cmark = {workspace = true,default-features = false,features = ["html"]}
qrcode = {workspace = true,default-features = false,features = ["svg"]}
serde = {workspace = true,features = ["derive"]}
serde_json = {workspace = true}
sha2 = {workspace = true}
thiserror = {workspace = true}
tracing = {workspace = true}
unicode-normalization = {workspace = true}
url = {workspace = true}
x25519-dalek = {workspace = true,features = ["static_secrets"]}
zeroize = {workspace = true,features = ["derive"]}

# Build-time only: stamps `YOUGEN_BUILD_ID` (local build time + git short hash)
# so the running wasm can print which bundle the browser loaded — the
# definitive stale-cached-wasm check. Build deps do not affect the wasm binary.
[build-dependencies]
chrono = {workspace = true}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# T5.2 (2026-05-20): `signer` feature enabled so `event_signer` can pull
# in `cokret_sdk::signatures::Ed25519DetachedJwsSigner` for the
# `RealEd25519` proof-mode path. Without it the SDK signatures module is
# canonical-bytes-only and the active-write signing path has nothing to
# call into.
# C33.2: OS-keychain handoff for `secure_key_store::KeyringSecureKeyStore`.
# Routes to macOS Keychain Services / freedesktop Secret Service / Windows
# Credential Manager via the platform-feature flags on stable native
# targets. Mobile host-bridge types remain behind target cfgs, but no
# iOS/Android artifact is part of the local 1.0 milestone.
#
# Pinned to 3.6.x because the 4.x line moved its public API to
# `keyring-core` (the 4.x `keyring` crate itself is now a CLI / sample
# wrapper without the classic `Entry` type). 3.6 stays the supported
# library surface for direct programmatic access.
# F-OS-NOTIFY-1 (2026-05-19): native desktop notifications. `notify-rust`
# bridges to macOS Notification Center, Linux freedesktop notifications,
# and Windows Toast notifications behind a single API. Skipped on the
# wasm32 build because browsers expose their own notification API
# directly through Dioxus / `web-sys`.
# YOU-01-007: `multipart` is required because the spec binds
# `POST /_cokret/self/blob/upload` to multipart/form-data
# (blob_upload_request_body), not a raw octet-stream body.
# CKP-0007 P3B.8.1 — opt-in crash telemetry. The Sentry client is
# initialised only when both the user-facing CrashTelemetryPrefs
# toggle is on AND a build-time `SENTRY_DSN` env var is set; an
# empty DSN logs a debug message and skips init silently per
# `src/telemetry.rs::sentry_init`. Wasm builds skip the dep entirely.
cokret-sdk = {workspace = true,features = ["full-surface", "signer"]}
cokret-client = {path = "../cokret-rust-sdk/crates/client",default-features = false,features = ["native"]}
dioxus = {workspace = true,features = ["desktop", "web"]}
keyring = {workspace = true,features = ["apple-native", "windows-native", "linux-native"]}
notify-rust = {workspace = true}
reqwest = {workspace = true,default-features = false,features = ["json", "multipart", "rustls", "stream", "form"]}
sentry = {workspace = true,default-features = false,features = ["backtrace", "contexts", "panic", "reqwest", "rustls"]}
tokio = {workspace = true,features = ["macros", "rt-multi-thread", "sync", "time"]}
tracing-subscriber = {workspace = true,features = ["env-filter", "fmt"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
# C36.1 (2026-05-10): wasm32 needs the same surface as native because the app
# code references `KeyVerification*` (device-runtime), `EventsSubscribeFrame`
# (sync-runtime), `KeyRefObject` (mls), etc. The previous
# `default-features = false` stripped these and produced E0432/E0425.
# The C36.0 parallel agent is closing the wasm32 SDK so `full-surface` builds
# cleanly under `--target wasm32-unknown-unknown`.
#
# T5.2: same `signer` feature as native — the wasm32 build uses the same
# Ed25519 detached-JWS pipeline; the signing seed comes from
# `LocalStorageSecureKeyStore` / `IndexedDbSecureKeyStore` instead of the
# OS keychain, with the documented "browser has no symmetric-secret tier"
# warning.
# Round 26 (A3): web-sys feature flags expanded so the WebPushTokenProvider
# can drive `navigator.serviceWorker.register` + `pushManager.subscribe(...)`
# end-to-end. The Crypto/SubtleCrypto features back the R5 WebCryptoBoundary
# so the WASM build can encrypt/decrypt against the browser's WebCrypto
# implementation while signing material stays in Rust (the SDK's
# MoveSigner / ed25519-dalek path is process-local and never leaves the
# wasm linear memory boundary).
# `tokio::time` is unsupported on wasm32-unknown-unknown — it calls
# `std::time::Instant::now()` and panics with "time not implemented on this
# platform". `gloo-timers` routes through `setTimeout` instead, which is what
# `sleep_for` uses for HTTP retry backoff in the wasm build.
cokret-sdk = {workspace = true,features = ["full-surface", "signer"]}
cokret-client = {path = "../cokret-rust-sdk/crates/client",default-features = false,features = ["wasm"]}
dioxus = {workspace = true,features = ["web"]}
gloo-timers = {workspace = true,features = ["futures"]}
js-sys = {workspace = true}
reqwest = {workspace = true,default-features = false,features = ["json", "multipart", "stream", "form"]}
tokio = {workspace = true,features = ["macros", "rt", "sync", "time"]}
tracing-wasm = {workspace = true}
wasm-bindgen = {workspace = true}
wasm-bindgen-futures = {workspace = true}
web-sys = {workspace = true,features = [
    "Storage",
    "Window",
    "CssStyleDeclaration",
    "MediaQueryList",
    "Navigator",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "PushManager",
    "PushSubscription",
    "PushSubscriptionOptionsInit",
    "Crypto",
    "SubtleCrypto",
    "CryptoKey",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlElement",
    "Url",
    # Sprint Q1 increment 22 (H6): IndexedDB-backed secure key store.
    # `IndexedDbSecureKeyStore` opens an IDB database, derives an
    # AES-GCM key via SubtleCrypto.deriveKey (`extractable: false`),
    # and persists entries under structured keys.
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbRequestReadyState",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "Event",
    "DomException",
    # Live WebRTC media transport (`src/rtc_transport/web.rs`): browser
    # RtcPeerConnection + getUserMedia capture + SDP offer/answer + ICE
    # candidate relay for 1:1 P2P and SFU room join.
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "RtcConfiguration",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcRtpSender",
    "RtcTrackEvent",
]}

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Stream J conformance gate (`tests/conformance_gates.rs`): JSON Schema
# 2020-12 validation of envelopes produced by typed builders against
# `cokret-spec/spec/v1/artifacts/schemas/event-envelope.schema.json`.
# Pinned to the same version cotest uses so a registry/resource bump
# lands in one place.

# cokret fork of DioxusLabs/components, branched off the same revision cargo
# already resolved. The only delta is an idempotency guard in
# `primitives/src/js/focus-trap.js`: `DialogRoot` injects that script per
# Dialog instance and dioxus re-executes it across mounts, but as a classic
# script its top-level `class FocusTrap` re-declaration threw
# `SyntaxError: 'FocusTrap' has already been declared`, corrupting the dialog
# focus-trap eval closure (`FnOnce called more than once` -> CLOSURE_DTORS
# out-of-bounds -> wasm heap corruption). See the fork branch for the full note.
jsonschema = {workspace = true,default-features = false,features = ["resolve-file"]}
rand_core = {workspace = true}
rand_core_06 = {workspace = true}
regex = {workspace = true}
# Pinned by rev; bump deliberately when upgrading.
[patch."https://github.com/DioxusLabs/components"]
dioxus-primitives = { git = "https://github.com/cokret/dioxus-components", rev = "3510aeee2d14f0ca2c11682c9b826650cb557d2f" }

# cokret fork of DioxusLabs/dioxus, branched off the v0.7.9 tag. The only delta
# is `Callback::__point_to` in `packages/core/src/events.rs`: upstream 0.7.9
# calls `.unwrap()` on `point_to`, which aborts the entire wasm instance (white
# screen) when an `Option<EventHandler>` prop's owner scope is reclaimed in the
# same frame the rsx diff tries to re-point its stable handle — surfacing as
# `Result::unwrap() on Dropped(ValueDroppedError)`. Re-pointing only reuses the
# stable handle for the current frame; the real callback is still owned by the
# new value, so the fork degrades that unwrap to a trace-log no-op.
#
# The wasm-shared lifetime crates below MUST come from the same git source as
# `dioxus-core`: a git `dioxus-core` pulls in git `generational-box` /
# `subsecond` via workspace deps, and if the registry copies remained, the same
# crate would exist under two sources and `GenerationalBox<T>` would mismatch
# across the registry `dioxus-signals`/`dioxus-web` and the patched core.
# See https://github.com/cokret/dioxus/commit/e59f9f24a5c27c9303cd61edd0452b44161374ab
# Pinned by rev; bump deliberately when upgrading.
[patch.crates-io]
dioxus-core       = { git = "https://github.com/cokret/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }
dioxus-core-types = { git = "https://github.com/cokret/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }
generational-box  = { git = "https://github.com/cokret/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }
subsecond         = { git = "https://github.com/cokret/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }
subsecond-types   = { git = "https://github.com/cokret/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }

[workspace]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.102"
argon2 = "0.5"
base64 = "0.22"
bip39 = "2.2.2"
chacha20poly1305 = {version = "0.10",default-features = false}
chime = {version = "0.3.0",path = "../chime"}
chrono = "0.4.45"
cokret-sdk = {package = "cokret",version = "0.3.0",path = "../cokret-rust-sdk/crates/sdk"}
dioxus = "0.7.9"
dioxus-icons = {version = "0.1.0",default-features = false}
dioxus-primitives = {version = "0.0.1",git = "https://github.com/DioxusLabs/components",default-features = false}
dioxus-router = "0.7.9"
ed25519-dalek = "2.2.0"
getrandom = "0.4.2"
getrandom_02 = {package = "getrandom",version = "0.2.17"}
gloo-timers = "0.4"
hkdf = "0.13"
hmac = "0.13"
x25519-dalek = "2.0.1"
image = {version = "0.25.10",default-features = false}
js-sys = "0.3"
jsonschema = {version = "0.46.5",default-features = false}
keyring = "3.6.3"
notify-rust = "4.17"
pulldown-cmark = {version = "0.13",default-features = false}
qrcode = {version = "0.14",default-features = false}
rand_core = "0.10"
# Distinct alias for the rand_core 0.6 API the cokret SDK's webvh inception
# builder expects (`prepare_inception` takes a `rand_core::RngCore` from 0.6).
# yougen's primary `rand_core` is 0.10, so the SDK's RngCore trait is reached
# through this aliased dependency to keep trait identity matched.
rand_core_06 = {package = "rand_core", version = "0.6.4", features = ["std"]}
regex = "1.12"
reqwest = {version = "0.13.4",default-features = false}
sentry = {version = "0.48.2",default-features = false}
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.11"
thiserror = "2"
tokio = "1.52.3"
tracing = "0.1"
tracing-subscriber = "0.3.23"
tracing-wasm = "0.2.1"
unicode-normalization = "0.1"
url = "2.5.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3.100"
zeroize = "1.8"
