[package]
name = "yougen"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Dioxus cross-platform Contrix v1 reference client (macOS/Windows/Linux/iOS/Android/Web)"
license = "Apache-2.0"
repository = "https://github.com/contrix/yougen"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = 0
strip = "debuginfo"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22"
chime = { path = "../chime", features = ["http"] }
chrono = { version = "0.4.42", features = ["serde"] }
dioxus-router = "0.7"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
url = "2.5.7"
# Move signing. ed25519-dalek for signatures; bs58 to encode public keys
# as did:key multibase (`z<base58btc(0xed01 || pubkey32)>`). Production
# deploys integrate OS keychain / WebAuthn / HSM via separate paths and
# only call `move_builder::sign_move_*` for the canonical-bytes-to-JWS step.
ed25519-dalek = { version = "2.1.1", features = ["pem", "pkcs8"] }
bs58 = "0.5.1"
tracing = "0.1"
# QR rendering for device-verification handoff. SVG output keeps the
# crate pure-Rust with no image / font dependencies.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Recovery flow (R-recovery-001): real Argon2id passphrase stretching +
# XChaCha20-Poly1305 AEAD for the Encrypted Cloud Vault upload. Both crates
# are pure-Rust, no_std-friendly and build cleanly under wasm32; the same
# pin is used for the ciphertext digest's sha256 (already in `sha2`).
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# A3 (round 28): markdown rendering for the timeline/chat content
# renderer. pulldown-cmark is pure-Rust, no_std-friendly, and known to
# build cleanly under wasm32-unknown-unknown. Raw-HTML pass-through is
# left disabled (default) so untrusted message bodies cannot inject
# arbitrary tags via `dangerous_inner_html`.
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Round 21: SDK bumped 0.4.0 → 0.5.0 by the parallel SDK agent. Pinned the
# version explicitly so a published-crates resolver picks the right minor.
contrix-sdk = { package = "contrix", version = "0.7.0", path = "../contrix-rust-sdk/crates/sdk", features = ["full-surface"] }
dioxus = { version = "=0.7.5", features = ["desktop", "mobile", "web"] }
# C33.2: OS-keychain handoff for `secure_key_store::KeyringSecureKeyStore`.
# Routes to macOS Keychain Services / freedesktop Secret Service / Windows
# Credential Manager via the platform-feature flags on stable native
# targets. The wasm32 + mobile builds fall back to MemorySecureKeyStore
# (mobile FFI lands next round).
#
# Pinned to 3.6.x because the 4.x line moved its public API to
# `keyring-core` (the 4.x `keyring` crate itself is now a CLI / sample
# wrapper without the classic `Entry` type). 3.6 stays the supported
# library surface for direct programmatic access.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
reqwest = { version = "0.12.24", features = ["json", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# C36.1 (2026-05-10): wasm32 needs the same surface as native because the app
# code references `KeyVerification*` (device-runtime), `EventsSubscribeFrame`
# (sync-runtime), `KeyRefObject` (mls), etc. The previous
# `default-features = false` stripped these and produced E0432/E0425.
# The C36.0 parallel agent is closing the wasm32 SDK so `full-surface` builds
# cleanly under `--target wasm32-unknown-unknown`.
contrix-sdk = { package = "contrix", version = "0.7.0", path = "../contrix-rust-sdk/crates/sdk", features = ["full-surface"] }
dioxus = { version = "=0.7.5", features = ["web"] }
reqwest = { version = "0.12.24", features = ["json", "stream"], default-features = false }
tokio = { version = "1.48.0", features = ["macros", "rt", "sync", "time"] }
# Round 26 (A3): web-sys feature flags expanded so the WebPushTokenProvider
# can drive `navigator.serviceWorker.register` + `pushManager.subscribe(...)`
# end-to-end. The Crypto/SubtleCrypto features back the R5 WebCryptoBoundary
# so the WASM build can encrypt/decrypt against the browser's WebCrypto
# implementation while signing material stays in Rust (the SDK's
# MoveSigner / ed25519-dalek path is process-local and never leaves the
# wasm linear memory boundary).
web-sys = { version = "0.3.82", features = [
    "Storage",
    "Window",
    "Navigator",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "PushManager",
    "PushSubscription",
    "PushSubscriptionOptionsInit",
    "Crypto",
    "SubtleCrypto",
    "CryptoKey",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlElement",
    "Url",
    # Sprint Q1 第二十二增量 (H6): IndexedDB-backed secure key store
    # — `IndexedDbSecureKeyStore` opens an IDB database, derives an
    # AES-GCM key via SubtleCrypto.deriveKey (`extractable: false`),
    # and persists entries under structured keys.
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbRequestReadyState",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "Event",
    "DomException",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# `tokio::time` is unsupported on wasm32-unknown-unknown — it calls
# `std::time::Instant::now()` and panics with "time not implemented on this
# platform". `gloo-timers` routes through `setTimeout` instead, which is what
# `sleep_for` uses for HTTP retry backoff in the wasm build.
gloo-timers = { version = "0.3", features = ["futures"] }
