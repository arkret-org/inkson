[package]
name = "inkson"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
description = "Arkret authority-commit reference client"
license = "Apache-2.0"
repository = "https://github.com/arkret-org/inkson"

[workspace]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
arkret-canonical = { version = "0.3.0", path = "../arkret-rust-sdk/crates/canonical", default-features = false }
arkret-identifiers = { version = "0.3.0", path = "../arkret-rust-sdk/crates/identifiers", default-features = false }
arkret-wire = { version = "0.3.0", path = "../arkret-rust-sdk/crates/wire", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "asset", "document", "mounted"] }
serde_json = "1.0.151"
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["desktop"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["web"] }
web-sys = { version = "0.3.104", features = ["Document", "Element", "History", "Location", "Node", "Window"] }

[lints]
workspace = true
