# cargo-deny configuration
# Documentation: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
# Include unsound advisories in transitive renderer dependencies.
unsound = "all"
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "transitive image/rav1e dependency with no compatible replacement" },
    { id = "RUSTSEC-2026-0173", reason = "transitive OpenMLS hax macro dependency with no compatible replacement" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Unlicense",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/glory-rs/glory",
    "https://github.com/sapid-ui/sapid",
    "https://github.com/Ranrar/wry",
    "https://github.com/johncarmack1984/tao",
    "https://github.com/glory-rs/blitz",
    "https://github.com/arkret-org/openmls",
    "https://github.com/arkret-org/secret-service-rs",
    "https://github.com/glory-rs/taffy",
]
