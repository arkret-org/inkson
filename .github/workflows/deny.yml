name: cargo-deny

on:
  push:
  pull_request:

jobs:
  deny:
    name: cargo deny (${{ matrix.graph }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: core
            arguments: --locked --target x86_64-unknown-linux-gnu
          - graph: web
            arguments: --locked --target wasm32-unknown-unknown --features web
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v6
        with:
          path: inkson
      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout garth
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout chime
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        with:
          command: check
          manifest-path: inkson/Cargo.toml
          arguments: ${{ matrix.arguments }}
