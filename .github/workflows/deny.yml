name: cargo-deny

on:
  push:
  pull_request:

jobs:
  deny:
    name: cargo deny (${{ matrix.graph }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: core
            arguments: --locked --target x86_64-unknown-linux-gnu
          - graph: web
            arguments: --locked --target wasm32-unknown-unknown --features web
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v7
        with:
          path: inkson
      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: 5a2d1665e1831ff6e6cefe8a0b09a4d37989b611
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout garth
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: 960e007b4905f91b2ffc52ccf91db0b3cf5ca44d
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout chime
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: fed3a6c08501ecb2e02fa0b10f6c152b07b8359e
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout arkret-spec
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: fa57d06e1aec58970e588d503621e65ba3445a32
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout Glory and Sapid
        shell: bash
        working-directory: inkson
        run: bash .ci/checkout-ui-dependencies.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        with:
          command: check
          manifest-path: inkson/Cargo.toml
          arguments: ${{ matrix.arguments }}
