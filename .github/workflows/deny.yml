name: cargo-deny

on:
  push:
  pull_request:

jobs:
  deny:
    name: cargo deny (${{ matrix.graph }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: core
            arguments: --locked --target x86_64-unknown-linux-gnu
          - graph: web
            arguments: --locked --target wasm32-unknown-unknown --features web
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v7
        with:
          path: inkson
      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: 819fc97ca2356cd0ed467864babfaca93e0b5494
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout garth
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: 8c35acec7c6d8c79b61c06855367340f0a17da78
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout chime
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: aa8e2afc78fa35c6248c1a1016280b22d7502645
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout arkret-spec
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: 4e46718f83a4fcbedc12ef7409bc68743ec41dc9
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout Glory and Sapid
        shell: bash
        working-directory: inkson
        run: bash .ci/checkout-ui-dependencies.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        with:
          command: check
          manifest-path: inkson/Cargo.toml
          arguments: ${{ matrix.arguments }}
