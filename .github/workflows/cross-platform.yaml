# Round 28 (rev. round 35): cross-platform Playwright matrix CI wiring.
#
# Drives the round-27 `tests/cross_platform/` 11-test suite (4 spec
# files: subtle_crypto / push_subscribe / local_storage / oidc_pkce)
# against Chromium, Firefox, and WebKit on a single ubuntu-latest
# runner via Playwright's bundled engines. 11 tests × 3 browsers = 33
# datapoints per CI run. The matrix runs on push / pull_request but
# only when something under `src/**` or `tests/cross_platform/**`
# changes — engine setup costs ~3 minutes per browser so we don't want
# to pay it for unrelated edits.
#
# ## Self-skip rules (mirroring Playwright's existing skip surface)
#
# - **Forks can't access secrets.** GitHub doesn't expose secrets to
#   PRs from forks; the cross-platform suite itself doesn't currently
#   read any secrets, but the e2e harness in `playwright.config.ts`
#   does for `INKSON_E2E_*` and the round-27 helpers all skip cleanly
#   when env vars are missing. To stay aligned, this workflow also
#   self-skips when the PR's head repo is not the upstream repo
#   (`pull_request.head.repo.full_name` != `github.repository`). The
#   `if:` on each step honors that.
#
# - **Browser executable missing locally.** Playwright's `setup`
#   action installs each engine; if a particular engine fails to
#   install (rare but happens during stack churn), the per-test
#   `gotoOrSkip` helper translates the `Executable doesn't exist`
#   error into `test.skip` so one missing engine doesn't fail the
#   whole matrix.
#
# - **HTML report only on failure.** Successful runs are noisy enough
#   in the workflow log; we only attach the HTML report artifact when
#   the matrix actually fails so downstream investigation has the
#   trace files + screenshots.
#
# ## fail-fast: false (round 35 — C37.2)
#
# The matrix is intentionally `fail-fast: false` so all three engines
# always run to completion. The whole point of the cross-platform
# matrix is to surface engine divergence, and that signal is lost when
# one early failure short-circuits the others. Cancellation only
# happens via the workflow-level cancel-in-progress concurrency rule
# below.
#
# ## Secrets wiring (round 35 — C37.2)
#
# The cross_platform spec files (subtle_crypto / push_subscribe /
# local_storage / oidc_pkce) currently drive raw browser APIs against
# the dx serve bundle and don't authenticate. The TEST_ACCOUNT_* and
# MOCK_PRINCIPAL_SERVER_URL env passthroughs below are wired in
# anticipation of future cross_platform specs that will exercise
# authenticated paths (e.g. an OIDC happy-path flow that posts to a
# mock principal server, or a passkey enrolment that needs a stable
# test-account credential pair).
#
# The Run step uses `${{ secrets.X }}` lookups that resolve to empty
# strings when the repo doesn't have the secret defined. The current
# spec files don't read these env vars, so missing secrets are a
# no-op; future specs that consume them MUST self-skip on the empty
# value (mirroring the `gotoOrSkip` pattern).
#
# ### How to add the secrets in repo settings
#
# 1. GitHub repo → Settings → Secrets and variables → Actions →
#    Repository secrets → New repository secret.
# 2. Add the following names (all optional — leave unset to skip
#    secret-dependent specs):
#    - `TEST_ACCOUNT_USERNAME` — handle for the shared cross-platform
#      test account (e.g. `cross-platform-bot.example`).
#    - `TEST_ACCOUNT_PASSWORD` — bootstrap password / passkey-bypass
#      token for the same account. Rotated quarterly.
#    - `MOCK_PRINCIPAL_SERVER_URL` — base URL of a long-lived mock
#      server instance (defaults to in-process Playwright stub when
#      unset; an external mock lets the WebKit secure-context tests
#      run over `https://`).
# 3. PRs from forks won't see these secrets — that's the upstream
#    GitHub Actions security model and the `if:` gate above mirrors it.

name: Cross-platform Playwright

on:
  push:
    paths:
      - "src/**"
      - "tests/cross_platform/**"
      - ".github/workflows/cross-platform.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "src/**"
      - "tests/cross_platform/**"
      - ".github/workflows/cross-platform.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

# Round 35 (C37.2): one matrix run per ref. A new push to the same
# branch cancels the in-flight matrix so reviewer feedback is fast.
# Disabled on the main branch so historical runs are preserved.
concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: "0.7.5"

jobs:
  cross-platform:
    name: ${{ matrix.browser }} (11-test suite)
    runs-on: ubuntu-latest
    # Round 27 self-skip rule: PRs from forks can't access secrets,
    # mirroring Playwright's existing self-skip logic in the e2e
    # config. The matrix doesn't strictly need secrets today (no auth
    # surfaces in the current specs), but keeping the gate aligned
    # with the rest of the CI surface avoids surprise drift if a
    # future test adds a secret-dependent step.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      # One browser failure shouldn't cancel the other two — we want
      # the full divergence surface in a single run. See header
      # docstring for the rationale.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v6
        with:
          path: inkson

      - name: Checkout arkret-spec
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout chime
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: inkson

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inkson/package-lock.json

      - name: Install npm dependencies
        working-directory: inkson
        run: npm ci

      - name: Cargo lib tests (sanity gate)
        working-directory: inkson
        # Round 35 (C37.2): the cross-platform matrix exercises the
        # wasm bundle through the browser's native APIs, but if the
        # native lib tests are red the wasm bundle is almost certainly
        # also broken. Run the sanity gate BEFORE the dioxus CLI
        # build (~5 min) and the Playwright browser install (~3 min)
        # so a regression there fails the matrix in well under a
        # minute on each browser shard.
        run: cargo test --locked --lib

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked

      - name: Install Playwright browsers (${{ matrix.browser }})
        working-directory: inkson
        # `--with-deps` pulls the OS-level shared libraries each engine
        # needs (chromium pulls libnss3, firefox pulls libxt6, webkit
        # pulls libwoff1 etc.). This is the upstream Playwright recipe
        # for headless engines on ubuntu-latest.
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run cross-platform suite (${{ matrix.browser }})
        working-directory: inkson
        env:
          # Pin the project list to the matrix browser so unrelated
          # engines don't even get queued (the playwright.config.ts
          # already filters by this env var).
          INKSON_CROSS_PLATFORM: ${{ matrix.browser }}
          # CI flag — playwright.config.ts uses it to decide whether
          # to reuse an existing dev server.
          CI: "1"
          # Round 35 (C37.2): test-account + mock principal server
          # passthroughs. The current specs don't read these — they
          # drive raw browser APIs against the dx serve bundle. The
          # passthrough is wired in anticipation of future
          # authenticated cross_platform specs (OIDC happy path,
          # passkey enrolment, push subscribe with real VAPID). Empty
          # strings when the repo doesn't have the secret defined;
          # specs that consume these env vars MUST self-skip on the
          # empty value.
          #
          # Adding the secrets: see the workflow header docstring.
          TEST_ACCOUNT_USERNAME: ${{ secrets.TEST_ACCOUNT_USERNAME }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
          MOCK_PRINCIPAL_SERVER_URL: ${{ secrets.MOCK_PRINCIPAL_SERVER_URL }}
        run: npx playwright test --config tests/cross_platform/playwright.config.ts

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            inkson/playwright-report/
            inkson/test-results/
          retention-days: 7
          if-no-files-found: ignore
