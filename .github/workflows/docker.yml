name: Docker

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  # Finish a release already building while newer main commits wait their turn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: inkson-web:local

jobs:
  image:
    name: Build and scan web image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v7
        with:
          path: inkson

      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout garth
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout chime
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout arkret-spec
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout Glory and Sapid
        shell: bash
        working-directory: inkson
        run: bash .ci/checkout-ui-dependencies.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare Docker context
        run: |
          mkdir -p docker-context
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            --exclude node_modules \
            --exclude test-results \
            --exclude playwright-report \
            --exclude artifacts \
            --exclude release-assets \
            inkson/ docker-context/inkson/
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            arkret-rust-sdk/ docker-context/arkret-rust-sdk/
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            garth/ docker-context/garth/
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            chime/ docker-context/chime/
          rsync -a --delete --exclude .git arkret-spec/ docker-context/arkret-spec/

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: docker-context
          file: docker-context/inkson/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,scope=web-${{ matrix.arch }},mode=max

      - name: Smoke test hosted client
        run: bash inkson/scripts/smoke-web-image.sh "$IMAGE_NAME"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: json
          output: trivy-image.json
          exit-code: "0"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Generate local image evidence
        shell: pwsh
        working-directory: inkson
        run: |
          New-Item -ItemType Directory -Force -Path dist/web-image | Out-Null
          Move-Item -Force ../trivy-image.json dist/web-image/trivy-image.json
          ./scripts/web-image-evidence.ps1 -ImageTag "${{ env.IMAGE_NAME }}" -SkipBuild

      - name: Upload local-only image evidence
        uses: actions/upload-artifact@v7
        with:
          name: inkson-web-local-evidence-${{ matrix.arch }}
          path: inkson/dist/web-image/
          if-no-files-found: error

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified architecture
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${REPOSITORY,,}:sha-${SOURCE_SHA}-${ARCH}"
          docker tag "$IMAGE_NAME" "$ref"
          docker push "$ref"

  publish:
    name: Publish multi-platform web image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$image:latest" --tag "$image:sha-$SOURCE_SHA" \
            "$image:sha-${SOURCE_SHA}-amd64" "$image:sha-${SOURCE_SHA}-arm64"
          docker buildx imagetools inspect "$image:sha-$SOURCE_SHA"
