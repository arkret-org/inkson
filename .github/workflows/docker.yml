name: Docker

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  # Finish a release already building while newer main commits wait their turn.
  cancel-in-progress: false

jobs:
  image:
    name: Build and push web image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v7
        with:
          path: inkson

      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: 5b95a6c57605e601a699a11068d30b9c528561bb
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout garth
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: 5e73ce767773400b878812579c7980c1c03aceec
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout chime
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: 4af4c0e45e317aa048b11df7d22582b5e52d9656
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout arkret-spec
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: b32b973f9845c77b076f0671d443857ba1c72834
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout Glory and Sapid
        shell: bash
        working-directory: inkson
        run: bash .ci/checkout-ui-dependencies.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare Docker context
        run: |
          mkdir -p docker-context
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            --exclude node_modules \
            --exclude test-results \
            --exclude playwright-report \
            --exclude artifacts \
            --exclude release-assets \
            inkson/ docker-context/inkson/
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            arkret-rust-sdk/ docker-context/arkret-rust-sdk/
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            garth/ docker-context/garth/
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            chime/ docker-context/chime/
          rsync -a --delete --exclude .git arkret-spec/ docker-context/arkret-spec/

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: docker-context
          file: docker-context/inkson/Dockerfile
          push: true
          sbom: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,scope=web-${{ matrix.arch }},mode=max

  publish:
    name: Publish multi-platform web image
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$image:latest" --tag "$image:sha-$SOURCE_SHA" \
            "$image:sha-${SOURCE_SHA}-amd64" "$image:sha-${SOURCE_SHA}-arm64"
          docker buildx imagetools inspect "$image:sha-$SOURCE_SHA"
