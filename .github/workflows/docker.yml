name: Docker

on:
  pull_request:
  push:
    branches: ["main", "master"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/yougen-web

jobs:
  image:
    name: Build web image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout yougen
        uses: actions/checkout@v6
        with:
          path: yougen

      - name: Checkout contrix-rust-sdk
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/contrix-rust-sdk
          path: contrix-rust-sdk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Prepare Docker context
        run: |
          mkdir -p docker-context
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            --exclude node_modules \
            --exclude test-results \
            --exclude playwright-report \
            yougen/ docker-context/yougen/
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            contrix-rust-sdk/ docker-context/contrix-rust-sdk/

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker-context/yougen/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
