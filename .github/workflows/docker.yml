name: Docker

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

env:
  IMAGE_NAME: inkson-web:local

jobs:
  image:
    name: Build and scan local web image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v6
        with:
          path: inkson

      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout garth
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout chime
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare Docker context
        run: |
          mkdir -p docker-context
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            --exclude node_modules \
            --exclude test-results \
            --exclude playwright-report \
            inkson/ docker-context/inkson/
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            arkret-rust-sdk/ docker-context/arkret-rust-sdk/
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            garth/ docker-context/garth/
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            chime/ docker-context/chime/

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker-context/inkson/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: json
          output: trivy-image.json
          exit-code: "0"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.20.6

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Generate local image evidence
        shell: pwsh
        working-directory: inkson
        run: |
          New-Item -ItemKind Directory -Force -Path dist/web-image | Out-Null
          Move-Item -Force ../trivy-image.json dist/web-image/trivy-image.json
          ./scripts/web-image-evidence.ps1 -ImageTag "${{ env.IMAGE_NAME }}" -SkipBuild

      - name: Upload local-only image evidence
        uses: actions/upload-artifact@v7
        with:
          name: inkson-web-local-evidence
          path: inkson/dist/web-image/
          if-no-files-found: error
