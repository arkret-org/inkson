name: Packages

on:
  pull_request:
  push:
    branches: ["main", "master"]
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"

jobs:
  native:
    name: Build ${{ matrix.package_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_name: yougen-linux-x64
            binary_name: yougen
            artifact_path: target/release/yougen
          - os: windows-latest
            package_name: yougen-windows-x64
            binary_name: yougen.exe
            artifact_path: target/release/yougen.exe
          - os: macos-latest
            package_name: yougen-macos-arm64
            binary_name: yougen
            artifact_path: target/release/yougen

    steps:
      - name: Checkout yougen
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: yougen

      - name: Checkout contrix-rust-sdk
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ github.repository_owner }}/contrix-rust-sdk
          path: contrix-rust-sdk

      - name: Checkout chime
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: yougen

      - name: Build release binary
        working-directory: yougen
        run: cargo build --release

      - name: Prepare artifact directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.package_name }}"
          Copy-Item -LiteralPath "yougen/${{ matrix.artifact_path }}" -Destination "dist/${{ matrix.package_name }}/${{ matrix.binary_name }}"
          Copy-Item -LiteralPath "yougen/README.md" -Destination "dist/${{ matrix.package_name }}/README.md"

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $stage = "dist/${{ matrix.package_name }}"
          $archive = "dist/${{ matrix.package_name }}-${{ github.ref_name }}"
          if ("${{ runner.os }}" -eq "Windows") {
            Compress-Archive -Path "$stage/*" -DestinationPath "$archive.zip"
          } else {
            tar -czf "$archive.tar.gz" -C "$stage" .
          }

      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.package_name }}
          path: dist/${{ matrix.package_name }}
          if-no-files-found: error

      - name: Upload release archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.package_name }}-archive
          path: |
            dist/${{ matrix.package_name }}-${{ github.ref_name }}.zip
            dist/${{ matrix.package_name }}-${{ github.ref_name }}.tar.gz
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: native
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout yougen
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download release archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: artifacts
          pattern: "*-archive"
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd artifacts
          ls -lh
          shasum -a 256 * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
