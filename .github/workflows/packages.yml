# Local desktop package evidence only. The phase-3 local milestone does not
# build iOS `.ipa` or Android APK artifacts, and tag pushes do not trigger this
# workflow.
name: Packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  native:
    name: Build ${{ matrix.package_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package_name: inkson-linux-x64
            binary_name: inkson
          - os: windows-latest
            package_name: inkson-windows-x64
            binary_name: inkson.exe
          - os: macos-latest
            package_name: inkson-macos-arm64
            binary_name: inkson

    steps:
      - name: Checkout inkson
        uses: actions/checkout@v7
        with:
          path: inkson

      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: 1abbf74976504a00903282f5aa9a5edf3750f291
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout arkret-spec fixtures
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: 0ac6a6eaed76129caab0c9817fac9722e2d96461
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout garth
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: 22be3c9765ba0bad21deb06923a09347a0ef5718
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout chime
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          ref: 82411cdb0481cf22896bd499c99823bd8c3c3e4e
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout Glory and Sapid
        shell: bash
        working-directory: inkson
        run: bash .ci/checkout-ui-dependencies.sh

      - name: Use D drive build storage on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = "D:/BuildCache/inkson-glory"
          New-Item -ItemType Directory -Force -Path "$cache/tmp", "D:/BuildCache/cargo", "D:/BuildCache/npm" | Out-Null
          "CARGO_TARGET_DIR=$cache/target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_HOME=D:/BuildCache/cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$cache/tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$cache/tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPYCACHEPREFIX=$cache/pycache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_cache=D:/BuildCache/npm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev pulseaudio-utils libfontconfig1-dev libfreetype6-dev libglib2.0-bin dpkg-dev \
            libxkbcommon-dev libudev-dev \
            libdbus-1-dev \
            xvfb xdotool xclip wl-clipboard scrot openbox weston gnome-keyring dbus-x11 at-spi2-core python3-pyatspi \
            libxdo-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve the actual Cargo desktop target directory
        working-directory: inkson
        shell: pwsh
        run: |
          $metadataJson = & cargo metadata --locked --format-version 1 --no-deps --manifest-path Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = $metadataJson | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$metadata.target_directory)) {
            throw 'Cargo metadata did not return a target directory'
          }
          $targetDirectory = [System.IO.Path]::GetFullPath([string]$metadata.target_directory)
          $releaseBinary = Join-Path (Join-Path $targetDirectory 'release') '${{ matrix.binary_name }}'
          "INKSON_DESKTOP_TARGET_DIRECTORY=$targetDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INKSON_DESKTOP_RELEASE_BINARY=$releaseBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: inkson

      # Library/Web graphs do not establish desktop dependency safety. Keep
      # unsound advisories fatal for the real Linux desktop renderer graph.
      - name: Audit the desktop renderer dependencies
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: inkson/Cargo.toml
          arguments: --locked --features desktop
          command: check
          command-arguments: advisories

      - name: Admit the real WebKit sandbox through the official AppArmor profile
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y apparmor-profiles bubblewrap
          # Ubuntu's official purpose-built profile admits bwrap user namespaces
          # while stripping capabilities from sandboxed children. Keep the
          # global userns restriction and the WebKit sandbox enabled.
          profile=''
          for directory in /usr/share/apparmor/extra-profiles /etc/apparmor.d; do
            if test -d "$directory"; then
              profile=$(find "$directory" -type f -name bwrap-userns-restrict -print -quit)
              if test -n "$profile"; then break; fi
            fi
          done
          if test -z "$profile"; then
            profile="$RUNNER_TEMP/bwrap-userns-restrict"
            curl --fail --silent --show-error --location \
              https://gitlab.com/apparmor/apparmor/-/raw/b0eb95457bc2de401920308869d016e696c73664/profiles/apparmor/profiles/extras/bwrap-userns-restrict \
              --output "$profile"
            printf '%s  %s\n' 11d39094f044f0cda0febb3ad517b830301da6b2ce929664af09ee9e4dd264f9 "$profile" | sha256sum --check
          fi
          dpkg-query --show apparmor apparmor-profiles bubblewrap
          sha256sum "$profile"
          sudo apparmor_parser --replace "$profile"
          sysctl kernel.apparmor_restrict_unprivileged_userns
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev \
            /bin/sh -c 'test "$(awk "/^CapEff:/{print \$2}" /proc/self/status)" = "0000000000000000"'

      - name: Build release binary
        working-directory: inkson
        run: python scripts/build_desktop.py --release

      - name: Exercise the Linux native persistence and management regression families
        if: runner.os == 'Linux'
        working-directory: inkson
        run: |
          set -euo pipefail
          verify_family() {
            local family="$1" expected="$2" name="$3"
            cargo test --locked --release --features desktop --lib "$family" -- --list > "$name-list.txt"
            test "$(grep -c ': test$' "$name-list.txt")" = "$expected"
            cargo test --locked --release --features desktop --lib "$family" 2>&1 | tee "$name-result.txt"
            grep -q "test result: ok\. $expected passed; 0 failed; 0 ignored;" "$name-result.txt"
          }
          verify_family 'state::tests::private_plaintext::' 23 private-plaintext
          verify_family 'state::e2ee_secure_cache::cache_persist_tests::' 12 cache-persist
          verify_family 'neutral_station_choice' 5 neutral-station
          verify_family 'native_bootstrap_load' 1 native-bootstrap
          verify_family 'views::realm_admin::admin_panel::' 19 admin-panel
          verify_family 'ephemeral::tests::' 1 typed-terminal
          verify_family 'secure_key_store::keyring::linux_runtime_tests::mock_' 2 linux-keystore-isolation
          verify_family 'state::current_index::tests::signal_strand_reader_requires_complete_cut_and_exact_typed_subject' 1 typing-1
          verify_family 'signal_receive_engine::tests::decrypted_strand_target_requires_exact_realm_and_circle_scope' 1 typing-2
          verify_family 'signal_receive_engine::tests::decrypted_typing_without_verified_current_produces_no_live_body' 1 typing-3

      - name: Exercise the real Linux SecretService from a UI Tokio runtime
        id: linux_secret_service
        if: runner.os == 'Linux'
        working-directory: inkson
        run: dbus-run-session -- /usr/bin/python3 scripts/linux-native-runtime-smoke.py --secret-service-probe

      - name: Preserve the actual Linux SecretService result and failure logs
        if: runner.os == 'Linux' && always() && steps.linux_secret_service.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: inkson-linux-secret-service-runtime
          path: inkson/dist/linux-native-runtime/secret-service-*
          if-no-files-found: error

      - name: Prepare artifact directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.package_name }}"
          Copy-Item -LiteralPath $env:INKSON_DESKTOP_RELEASE_BINARY -Destination "dist/${{ matrix.package_name }}/${{ matrix.binary_name }}"
          Copy-Item -LiteralPath "inkson/assets" -Destination "dist/${{ matrix.package_name }}/assets" -Recurse
          Copy-Item -LiteralPath "inkson/README.md" -Destination "dist/${{ matrix.package_name }}/README.md"

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package_name }}
          path: dist/${{ matrix.package_name }}
          if-no-files-found: error

      - name: Local signing dry-run evidence
        working-directory: inkson
        shell: pwsh
        run: ./scripts/signing-dry-run.ps1 -ArtifactPath $env:INKSON_DESKTOP_RELEASE_BINARY -NoBuild

      - name: Upload signing dry-run evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package_name }}-signing-dry-run
          path: inkson/dist/signing/
          if-no-files-found: error

      - name: Install Python for the native platform renderer probe
        if: runner.os != 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Exercise the actual Windows or macOS renderer
        id: platform_renderer
        if: runner.os != 'Linux'
        working-directory: inkson
        shell: pwsh
        run: |
          python scripts/desktop-platform-smoke.py --binary $env:INKSON_DESKTOP_RELEASE_BINARY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native platform renderer evidence
        if: runner.os != 'Linux' && always() && steps.platform_renderer.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package_name }}-renderer-runtime
          path: inkson/dist/desktop-platform-runtime/
          if-no-files-found: error

      - name: Build local Linux package
        if: runner.os == 'Linux'
        working-directory: inkson
        shell: pwsh
        run: ./scripts/linux-package-local.ps1 -BinaryPath $env:INKSON_DESKTOP_RELEASE_BINARY

      - name: Upload local Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package_name }}-deb-local
          path: inkson/dist/linux-packages/
          if-no-files-found: error

      - name: Verify the exact real Linux package executable
        id: linux_package
        if: runner.os == 'Linux'
        working-directory: inkson
        run: |
          package=$(find dist/linux-packages -maxdepth 1 -type f -name '*.deb')
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --extract "$package" dist/linux-package-extracted
          cmp "$INKSON_DESKTOP_RELEASE_BINARY" dist/linux-package-extracted/usr/bin/inkson

      - name: Exercise real X11 native keyboard clipboard blur and cold restore
        id: linux_x11_renderer
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: inkson
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 scripts/linux-native-runtime-smoke.py --backend x11 --binary dist/linux-package-extracted/usr/bin/inkson

      - name: Exercise real Wayland native keyboard clipboard blur and cold restore
        id: linux_wayland_renderer
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: inkson
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 scripts/linux-native-runtime-smoke.py --backend wayland --binary dist/linux-package-extracted/usr/bin/inkson

      - name: Upload Linux native runtime evidence
        if: runner.os == 'Linux' && always() && steps.linux_package.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: inkson-linux-native-runtime
          path: inkson/dist/linux-native-runtime/
          if-no-files-found: error

      - name: Require both complete Linux runtime oracles
        if: runner.os == 'Linux' && always()
        run: test '${{ steps.linux_x11_renderer.outcome }}' = success && test '${{ steps.linux_wayland_renderer.outcome }}' = success
