name: Packages

on:
  pull_request:
  push:
    branches: ["main", "master"]
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Build ${{ matrix.package_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_name: chask-linux-x64
            binary_name: chask
            artifact_path: target/release/chask
          - os: windows-latest
            package_name: chask-windows-x64
            binary_name: chask.exe
            artifact_path: target/release/chask.exe
          - os: macos-latest
            package_name: chask-macos-arm64
            binary_name: chask
            artifact_path: target/release/chask

    steps:
      - name: Checkout chask
        uses: actions/checkout@v6
        with:
          path: chask

      - name: Checkout contrix-rust-sdk
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/contrix-rust-sdk
          path: contrix-rust-sdk

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: chask

      - name: Build release binary
        working-directory: chask
        run: cargo build --release

      - name: Prepare artifact directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.package_name }}"
          Copy-Item -LiteralPath "chask/${{ matrix.artifact_path }}" -Destination "dist/${{ matrix.package_name }}/${{ matrix.binary_name }}"
          Copy-Item -LiteralPath "chask/README.md" -Destination "dist/${{ matrix.package_name }}/README.md"

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package_name }}
          path: dist/${{ matrix.package_name }}
          if-no-files-found: error
