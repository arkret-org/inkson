name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: "0.7.10"
  # Fetch the public yoface Cargo git dependency through the git CLI.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust-and-web:
    name: Rust tests and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v6
        with:
          path: inkson

      - name: Checkout arkret-spec
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout garth
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout chime
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            gnome-keyring \
            libsecret-tools \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: inkson

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inkson/package-lock.json

      - name: Install npm dependencies
        working-directory: inkson
        run: npm ci

      - name: Verify vendored asset integrity
        working-directory: inkson
        run: node scripts/verify_vendored_assets.mjs

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked

      # ARC-0002 (重构计划 2026-07-10): legacy patterns must ratchet to zero.
      - name: Deletion gate
        working-directory: inkson
        run: bash scripts/deletion_gate.sh

      - name: SDK wire type ownership gate
        working-directory: inkson
        run: python ../arkret-rust-sdk/tools/wire_type_ownership_audit.py --workspace-root .. --require-repository inkson

      - name: Check formatting
        working-directory: inkson
        run: cargo +nightly fmt --all -- --check

      - name: Clippy
        working-directory: inkson
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: inkson
        run: bash scripts/test-native-with-keystore.sh --locked

      # Production-path gate: build + test without optional local UI surfaces.
      - name: cargo check (no-default-features, prod path)
        working-directory: inkson
        run: cargo check --workspace --no-default-features

      - name: cargo test (no-default-features)
        working-directory: inkson
        run: cargo test --workspace --no-default-features --no-run

      - name: Web build
        working-directory: inkson
        run: dx build --platform web --features web

      - name: Install Playwright browser
        working-directory: inkson
        run: npx playwright install --with-deps chromium

      - name: Install Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Bind WebAssembly tests to the installed Chrome
        env:
          TEST_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          TEST_CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          browser = os.environ["TEST_CHROME"]
          driver = os.environ["TEST_CHROMEDRIVER"]
          versions = [subprocess.check_output([binary, "--version"], text=True).strip()
                      for binary in (browser, driver)]
          majors = [re.search(r"\b(\d+)\.", version).group(1) for version in versions]
          if majors[0] != majors[1]:
              raise SystemExit(f"Chrome/ChromeDriver version mismatch: {versions}")
          print("Matched browser and driver:", *versions, sep="\n")
          # wasm-bindgen-test-runner reads WebDriver capabilities; CHROME is
          # not a browser selector and leaves the runner's system Chrome in use.
          destination = Path(os.environ["RUNNER_TEMP"]) / "inkson-webdriver.json"
          destination.write_text(json.dumps({"goog:chromeOptions": {"binary": browser}}))
          PY

      - name: Resolve locked wasm-bindgen version
        working-directory: inkson
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          versions = {p["version"] for p in packages if p["name"] == "wasm-bindgen"}
          if len(versions) != 1:
              raise SystemExit("Expected exactly one locked wasm-bindgen version")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"WASM_BINDGEN_VERSION={versions.pop()}\n")
          PY

      - name: Install wasm-bindgen test runner
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      - name: WebAssembly browser tests
        working-directory: inkson
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ runner.temp }}/inkson-webdriver.json
          # The runner's default 20s covers the whole binary. This suite also
          # observes a real cancelled 12s timer after its large IndexedDB cases.
          WASM_BINDGEN_TEST_TIMEOUT: "120"
        run: >-
          cargo test --locked --target wasm32-unknown-unknown
          --test mls_data_plane_wasm
          --test wasm_indexed_db_capacity

      - name: Browser end-to-end tests
        working-directory: inkson
        run: npm run e2e

      - name: Start web preview for Lighthouse
        working-directory: inkson
        shell: bash
        run: |
          nohup dx serve --platform web --features web --port 4528 --open false > ../inkson-lighthouse-server.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4528 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../inkson-lighthouse-server.log
          exit 1

      - name: Lighthouse budget
        working-directory: inkson
        run: |
          mkdir -p dist/lighthouse
          npx --yes lighthouse@12 http://127.0.0.1:4528 --output=json --output-path=dist/lighthouse/lighthouse.json --budget-path=docs/lighthouse-budget.json --chrome-flags="--headless=new --no-sandbox"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: inkson/dist/lighthouse/
          if-no-files-found: ignore
