name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: "0.7.5"

jobs:
  rust-and-web:
    name: Rust tests and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v6
        with:
          path: inkson

      - name: Checkout cokret-spec
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/cokret-spec
          path: cokret-spec
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout cokret-rust-sdk
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/cokret-rust-sdk
          path: cokret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout chime
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: inkson

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inkson/package-lock.json

      - name: Install npm dependencies
        working-directory: inkson
        run: npm ci

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked

      - name: Check formatting
        working-directory: inkson
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: inkson
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: inkson
        run: cargo test

      # Production-path gate: build + test without optional local UI surfaces.
      - name: cargo check (no-default-features, prod path)
        working-directory: inkson
        run: cargo check --workspace --no-default-features

      - name: cargo test (no-default-features)
        working-directory: inkson
        run: cargo test --workspace --no-default-features --no-run

      - name: Web build
        working-directory: inkson
        run: dx build --platform web

      - name: Start web preview for Lighthouse
        working-directory: inkson
        shell: bash
        run: |
          nohup dx serve --platform web --port 4528 --open false > ../inkson-lighthouse-server.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4528 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../inkson-lighthouse-server.log
          exit 1

      - name: Lighthouse budget
        working-directory: inkson
        run: npx --yes lighthouse@12 http://127.0.0.1:4528 --output=json --output-path=dist/lighthouse/lighthouse.json --budget-path=docs/lighthouse-budget.json --chrome-flags="--headless=new --no-sandbox"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: inkson/dist/lighthouse/
          if-no-files-found: ignore
