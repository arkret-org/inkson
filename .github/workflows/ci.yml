name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: "0.7.5"

jobs:
  rust-and-web:
    name: Rust tests and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout yougen
        uses: actions/checkout@v6
        with:
          path: yougen

      - name: Checkout contrix-rust-sdk
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/contrix-rust-sdk
          path: contrix-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout chime
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: yougen

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: yougen/package-lock.json

      - name: Install npm dependencies
        working-directory: yougen
        run: npm ci

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked

      - name: Check formatting
        working-directory: yougen
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: yougen
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: yougen
        run: cargo test

      # Production-path gate: build + test with `demo-crypto` and
      # `dev_proof` features OFF so the `upload_keys` /
      # `publish_mls_key_package` / `send_to_device` placeholder
      # branches that ship to a release binary stay in the
      # `anyhow::bail!` arm. Compiling here catches a future refactor
      # that accidentally drops the prod-path arm or re-introduces
      # demo crypto bytes on the production wire path.
      - name: cargo check (no-default-features, prod path)
        working-directory: yougen
        run: cargo check --workspace --no-default-features

      - name: cargo test (no-default-features)
        working-directory: yougen
        run: cargo test --workspace --no-default-features --no-run

      - name: Web build
        working-directory: yougen
        run: dx build --platform web

      - name: Start web preview for Lighthouse
        working-directory: yougen
        shell: bash
        run: |
          nohup dx serve --platform web --port 4528 --open false > ../yougen-lighthouse-server.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4528 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../yougen-lighthouse-server.log
          exit 1

      - name: Lighthouse budget
        working-directory: yougen
        run: npx --yes lighthouse@12 http://127.0.0.1:4528 --output=json --output-path=dist/lighthouse/lighthouse.json --budget-path=docs/lighthouse-budget.json --chrome-flags="--headless=new --no-sandbox"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: yougen/dist/lighthouse/
          if-no-files-found: ignore
