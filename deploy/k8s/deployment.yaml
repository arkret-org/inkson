apiVersion: apps/v1
kind: Deployment
metadata:
  name: inkson-web
  labels:
    app.kubernetes.io/name: inkson
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inkson
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inkson
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: nginx
          # Replace with the build pipeline's pinned digest; the image
          # contains nginx + the Dioxus web WASM bundle under `/usr/share/nginx/html`.
          image: ghcr.io/arkret/inkson-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
