apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inkson-web
  labels:
    app.kubernetes.io/name: inkson
    app.kubernetes.io/component: web
  annotations:
    # cert-manager wires TLS; swap issuer name for your deployment.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # SPA fallback: every unknown path serves index.html so client-side
    # routing (dioxus-router) handles the URL.
    nginx.ingress.kubernetes.io/custom-http-errors: "404"
    nginx.ingress.kubernetes.io/default-backend: inkson-web
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - inkson.example.com
      secretName: inkson-web-tls
  rules:
    - host: inkson.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inkson-web
                port:
                  name: http
