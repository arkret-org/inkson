server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    # Substitution is limited to HTML; JS/Wasm and saved client profiles are untouched.
    sub_filter_once on;
    sub_filter '<head>' '<head><meta name="inkson-station-url" content="${INKSON_STATION_URL}">';
    location /assets/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
