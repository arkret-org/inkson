<!doctype html>
<html lang="zh-CN" data-theme="dark" data-lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Call · Contrix</title>
  <link rel="stylesheet" href="../styles.css">
  <script defer src="../theme.js"></script>
</head>
<body>
  <main class="mobile-stage">
    <div class="frame-meta"><a href="../index.html">← <span class="i18n"><span class="zh">返回</span><span class="en">Back</span></span></a></div>

    <div class="phone" style="background:#0e0f17;">
      <div class="status-bar" style="color:white;"><span>9:41</span><span class="icons">● ◐ 100%</span></div>
      <div class="phone-screen" style="background:#0e0f17;">

        <!-- Banner -->
        <div style="padding: 8px 14px; background: rgba(255,255,255,0.06); display:flex; align-items:center; gap:6px; font-size:11px; color:white;">
          <span class="pill solid-success xs">🔒 E2EE</span>
          <span>Q4 retro</span>
          <span class="dim" style="margin-left:auto;">SFU · 12:14</span>
        </div>

        <!-- Self preview small + others grid -->
        <div style="padding: 12px; display:grid; grid-template-columns: 1fr 1fr; gap:8px; flex:1;">
          <div class="tile speaker" style="aspect-ratio: 9/16;">
            <span class="avatar lg" style="background:linear-gradient(135deg,#0ea5e9,#14b8a6); position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">B</span>
            <span class="peer-name">Ben · speaking</span>
          </div>
          <div class="tile" style="aspect-ratio: 9/16;">
            <span class="avatar lg" style="background:linear-gradient(135deg,#be185d,#ec4899); position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">C</span>
            <span class="peer-icons">🔇</span>
            <span class="peer-name">Carol</span>
          </div>
          <div class="tile" style="aspect-ratio: 9/16;">
            <span class="avatar lg" style="background:linear-gradient(135deg,#0e7490,#0ea5e9); position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">D</span>
            <span class="peer-name">Dan</span>
          </div>
          <div class="tile" style="aspect-ratio: 9/16;">
            <span class="avatar lg" style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">A</span>
            <span class="peer-name">you</span>
          </div>
        </div>

        <!-- Bottom controls -->
        <div style="background:#15161e; padding: 16px 16px 22px; border-top:1px solid #2a2c40; display:flex; justify-content:space-around; align-items:center;">
          <button class="call-btn">🎤</button>
          <button class="call-btn">📹</button>
          <button class="call-btn">🔊</button>
          <button class="call-btn primary" title="record (needs cx.call.record)">⏺</button>
          <button class="call-btn danger lg" style="transform:rotate(135deg);">📞</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
