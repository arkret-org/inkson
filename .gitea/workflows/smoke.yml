name: Smoke

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-smoke:
    name: Rust format, check, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v4
        with:
          path: inkson

      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout garth
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout chime
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN }}

      # `yoface` is a private cargo git dependency on github.com, not a sibling
      # checkout. `GITHUB_COM_TOKEN` must hold a GitHub PAT that can read
      # arkret-org/yoface — the Gitea `CI_REPO_TOKEN` cannot authenticate there.
      - name: Authenticate cargo for the private yoface git dependency
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_COM_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        working-directory: inkson
        run: cargo fmt --check

      - name: Cargo check
        working-directory: inkson
        run: cargo check --locked --all-targets

      - name: Rust tests
        working-directory: inkson
        run: cargo test --locked

  platform-checks:
    name: Web and cross-platform checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v4
        with:
          path: inkson

      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout garth
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout chime
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN }}

      # `yoface` is a private cargo git dependency on github.com, not a sibling
      # checkout. `GITHUB_COM_TOKEN` must hold a GitHub PAT that can read
      # arkret-org/yoface — the Gitea `CI_REPO_TOKEN` cannot authenticate there.
      - name: Authenticate cargo for the private yoface git dependency
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_COM_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            wasm32-unknown-unknown
            x86_64-unknown-linux-gnu
            x86_64-pc-windows-gnu
            aarch64-apple-darwin
            aarch64-apple-ios
            aarch64-linux-android

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked

      - name: Web wasm check
        working-directory: inkson
        run: cargo check --locked --target wasm32-unknown-unknown

      - name: Dioxus web build
        working-directory: inkson
        run: dx build --platform web --release

      - name: Linux target check
        working-directory: inkson
        run: cargo check --locked --target x86_64-unknown-linux-gnu

      - name: Windows target check
        working-directory: inkson
        continue-on-error: true
        run: cargo check --locked --target x86_64-pc-windows-gnu

      - name: macOS target check
        working-directory: inkson
        continue-on-error: true
        run: cargo check --locked --target aarch64-apple-darwin

      - name: iOS host-bridge stub check
        working-directory: inkson
        continue-on-error: true
        run: cargo check --locked --target aarch64-apple-ios --features mobile-ios

      - name: Android host-bridge stub check
        working-directory: inkson
        continue-on-error: true
        run: cargo check --locked --target aarch64-linux-android --features mobile-android

  responsive-e2e:
    name: Responsive viewport e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v4
        with:
          path: inkson

      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout garth
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout chime
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN }}

      # `yoface` is a private cargo git dependency on github.com, not a sibling
      # checkout. `GITHUB_COM_TOKEN` must hold a GitHub PAT that can read
      # arkret-org/yoface — the Gitea `CI_REPO_TOKEN` cannot authenticate there.
      - name: Authenticate cargo for the private yoface git dependency
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_COM_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inkson/package-lock.json

      - name: Install browser dependencies
        working-directory: inkson
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run responsive viewport tests
        working-directory: inkson
        run: npm run e2e:viewport
