name: Smoke

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-smoke:
    name: Rust format, check, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v4
        with:
          path: inkson

      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout garth
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout chime
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN }}


      - name: Checkout arkret-spec
        uses: actions/checkout@v6
        with:
          repository: ${{ gitea.repository_owner }}/arkret-spec
          path: arkret-spec
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout Glory and Sapid
        shell: bash
        working-directory: inkson
        run: bash .ci/checkout-ui-dependencies.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            gnome-keyring \
            libsecret-tools \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev pulseaudio-utils libfontconfig1-dev \
            libxkbcommon-dev \
            libudev-dev \
            libxdo-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Format check
        working-directory: inkson
        run: cargo +nightly fmt -p inkson -- --check

      - name: Cargo check
        working-directory: inkson
        run: cargo check --locked --features app --all-targets

      - name: Rust tests
        working-directory: inkson
        run: bash scripts/test-native-with-keystore.sh --locked

  platform-checks:
    name: Web and cross-platform checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v4
        with:
          path: inkson

      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout garth
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout chime
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN }}


      - name: Checkout arkret-spec
        uses: actions/checkout@v6
        with:
          repository: ${{ gitea.repository_owner }}/arkret-spec
          path: arkret-spec
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout Glory and Sapid
        shell: bash
        working-directory: inkson
        run: bash .ci/checkout-ui-dependencies.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev pulseaudio-utils libfontconfig1-dev \
            libxkbcommon-dev \
            libudev-dev \
            libxdo-dev \
            librsvg2-dev

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            wasm32-unknown-unknown
            x86_64-unknown-linux-gnu
            x86_64-pc-windows-gnu
            aarch64-apple-darwin
            aarch64-apple-ios
            aarch64-linux-android

      - name: Install matching wasm-bindgen CLI
        working-directory: inkson
        run: python .ci/install-wasm-bindgen.py

      - name: Web wasm check
        working-directory: inkson
        run: cargo check --locked --features web --target wasm32-unknown-unknown

      - name: Glory/Sapid web build
        working-directory: inkson
        run: python scripts/build_web.py --release

      - name: Linux target check
        working-directory: inkson
        run: cargo check --locked --target x86_64-unknown-linux-gnu

      - name: Windows target check
        working-directory: inkson
        continue-on-error: true
        run: cargo check --locked --target x86_64-pc-windows-gnu

      - name: macOS target check
        working-directory: inkson
        continue-on-error: true
        run: cargo check --locked --target aarch64-apple-darwin

      - name: iOS host-bridge stub check
        working-directory: inkson
        continue-on-error: true
        run: cargo check --locked --target aarch64-apple-ios --features mobile-ios

      - name: Android host-bridge stub check
        working-directory: inkson
        continue-on-error: true
        run: cargo check --locked --target aarch64-linux-android --features mobile-android

  responsive-e2e:
    name: Responsive viewport e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inkson
        uses: actions/checkout@v4
        with:
          path: inkson

      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout garth
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout chime
        uses: actions/checkout@v4
        with:
          repository: ${{ gitea.repository_owner }}/chime
          path: chime
          token: ${{ secrets.CI_REPO_TOKEN }}


      - name: Checkout arkret-spec
        uses: actions/checkout@v6
        with:
          repository: ${{ gitea.repository_owner }}/arkret-spec
          path: arkret-spec
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Checkout Glory and Sapid
        shell: bash
        working-directory: inkson
        run: bash .ci/checkout-ui-dependencies.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        working-directory: inkson
        run: python .ci/install-wasm-bindgen.py

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inkson/package-lock.json

      - name: Install browser dependencies
        working-directory: inkson
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run responsive viewport tests
        working-directory: inkson
        run: npm run e2e:viewport
